<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diesel Injector Doctor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Diesel Injector Doctor</h1>
    
    <!-- Step 1: Select Injector Type -->
    <div id="step1" class="step">
      <h2>Step 1: Select Injector Type</h2>
      <select id="injectorType">
        <option value="bosch">Bosch Common Rail</option>
        <option value="delphi">Delphi Diesel</option>
        <option value="denso">Denso HP</option>
        <option value="other">Other</option>
      </select>
      <button type="button" onclick="nextStep(1)">Next</button>
    </div>

    <!-- Step 2: Enter Test Results -->
    <div id="step2" class="step hidden">
      <h2>Step 2: Enter Test Results</h2>
      <form id="testForm">
        <!-- Dynamic fields will load here based on injector type -->
        <div id="dynamicFields"></div>
        <button type="button" onclick="diagnose()">Diagnose</button>
      </form>
    </div>

    <!-- Step 3: Diagnosis Results -->
    <div id="step3" class="step hidden">
      <h2>Diagnosis Report</h2>
      <div id="diagnosisResult"></div>
      <button type="button" onclick="resetApp()">Test Another Injector</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
